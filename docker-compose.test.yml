# Cross-process acceptance environment for priority analyzer result traffic.
# analyzer-mock sends real GeneXpert ASTM traffic and writes a real
# FluoroCycler file; WireMock captures the normalized OpenELIS request.

services:
  # OpenELIS Analyzer Bridge (under test)
  openelis-analyzer-bridge:
    build: .
    ports:
      - "12001:12001"   # ASTM LIS1-A listener
      - "12011:12011"   # ASTM E1381-95 listener
      - "2575:2575"     # MLLP HL7 listener
      - "8443:8443"     # HTTP /input endpoint + actuator
    environment:
      SPRING_PROFILE: test
      LOGGING_LEVEL_ORG_ITECH: DEBUG
      LOGGING_LEVEL_ROOT: INFO
    volumes:
      - ./configuration.test.yml:/app/configuration.yml:ro
      - analyzer-input:/mnt/analyzer-import
    tmpfs:
      - /data/openelis-analyzer-bridge:uid=9257,gid=9257,mode=0770
    networks:
      astm-test-net:
        ipv4_address: 172.28.0.100
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      wiremock:
        condition: service_healthy

  analyzer-mock:
    build:
      context: ${ANALYZER_MOCK_CONTEXT:?Set ANALYZER_MOCK_CONTEXT to the analyzer-mock-server checkout}
    command: ["python", "-u", "server.py", "--api-port", "8080"]
    environment:
      ANALYZER_BRIDGE_PROFILES_DIR: /bridge-profiles
    ports:
      - "18080:8080"
    volumes:
      - ./src/main/resources/analyzer-profiles:/bridge-profiles:ro
      - analyzer-input:/data/analyzer-imports
    networks:
      astm-test-net:
        ipv4_address: 172.28.0.150
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  # WireMock — captures forwarded messages for verification
  # Query API: GET http://localhost:8080/__admin/requests
  # Reset:     DELETE http://localhost:8080/__admin/requests
  wiremock:
    image: wiremock/wiremock:3.3.1
    container_name: wiremock-capture
    ports:
      - "8080:8080"
    command:
      - --port=8080
      - --verbose
      - --global-response-templating
    volumes:
      - ./test-data/wiremock:/home/wiremock
    networks:
      astm-test-net:
        ipv4_address: 172.28.0.200
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  astm-test-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  analyzer-input:
