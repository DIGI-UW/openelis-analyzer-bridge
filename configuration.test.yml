# Test configuration for E2E Docker testing
# WireMock at 172.28.0.200:8080 acts as OpenELIS capture server

bridge:
  openelis:
    url: http://172.28.0.200:8080
    connectTimeoutSeconds: 10
    readTimeoutSeconds: 10
    retry:
      maxAttempts: 1
      backoffMs: 500

  file:
    enabled: true
    stateStorePath: /tmp/openelis-analyzer-bridge/file-state.db
    pollIntervalMs: 2000
    fileStabilityTimeoutMs: 2000
    maxRetryAttempts: 2
    retryDelayMs: 500

org:
  itech:
    ahb:
      forward-http-server:
        uri: http://172.28.0.200:8080/api/OpenELIS-Global/analyzer

      listen-astm-server:
        port: 12001
        establishment-timeout-seconds: 15
        receive-timeout-seconds: 30

      listen-astm-e1381-95-server:
        port: 12011

      forward-astm-server:
        host-name: localhost
        port: 5000

      mllp:
        enabled: true
        port: 2575

server:
  port: 8443

logging:
  level:
    root: INFO
    org.itech: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  health:
    mllp:
      enabled: true
    serial:
      enabled: true
    filewatcher:
      enabled: true
    httpforward:
      enabled: true
