name: Run Tests

on:
  push:
    branches: [master, develop, "*-*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout analyzer mock fixtures
        uses: actions/checkout@v4
        with:
          repository: DIGI-UW/analyzer-mock-server
          ref: 504ffec81a5b93f6be91231051e8fe0720f61eb1
          path: analyzer-mock-server

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build library first
        run: |
          cd astm-http-lib
          mvn clean install

      - name: Run tests
        run: mvn clean test

      - name: Verify shipped profiles against analyzer mock fixtures
        run: >-
          mvn
          -Dtest=org.itech.ahb.profile.PriorityProfileMockFixtureIT,org.itech.ahb.profile.QuantStudioProfileFixtureIT
          -DanalyzerMockDir=${{ github.workspace }}/analyzer-mock-server
          test

      - name: Generate test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Maven Tests
          path: "**/surefire-reports/*.xml"
          reporter: java-junit
          fail-on-error: true
