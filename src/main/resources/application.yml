spring:
  profiles:
    active: prod

server:
  # Bridge validates forwarding headers against its explicit trusted-proxy list.
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        include: loggers, health
    loggers:
      enabled: true

bridge:
  profile-catalog:
    directory: ${BRIDGE_PROFILE_CATALOG_DIRECTORY:/data/openelis-analyzer-bridge/profile-catalog}
    shipped-pattern: classpath*:/analyzer-profiles/**/*.json
  connectivity:
    # Reserved; no runtime consumer. Does not configure listeners or receiver probes.
    advertised-host: ${BRIDGE_CONNECTIVITY_ADVERTISED_HOST:}
