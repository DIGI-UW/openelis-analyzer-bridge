# ============================================================================
# ASTM-HTTP Bridge Configuration
# ============================================================================
# This file configures the bridge for bi-directional analyzer communication.
#
# CONFIGURATION FORMATS:
#
# 1. Bridge runtime settings (bridge.*)
#    Used by: security, profile catalog, durable connections, and FILE runtime.
#    Properties: bridge.file.*, bridge.profile-catalog.*, bridge.connection-catalog.*,
#    bridge.security.*
#
# 2. OpenELIS forwarding settings (org.itech.ahb.forward-http-server.*)
#    Used by: HttpForwardingRouter, FILE FHIR forwarding, registry bootstrap,
#    and forward-server health checks.
#    This is the single bridge → OE forwarding configuration path.
# ============================================================================

# Bridge Configuration (NEW FORMAT - v2.0+)
bridge:
  # Security configuration for the /input HTTP endpoint (M7.1)
  # Protects against unauthorized data injection via the HTTP transport.
  # Non-HTTP transports (ASTM/TCP, MLLP, Serial, File) are unaffected.
  #
  # Password: Plaintext is BCrypt-encoded once at startup. Values already in delegating form
  # ({bcrypt}$2a$..., {noop}..., etc.) are stored as-is — do not double-encode.
  # In production, set BRIDGE_AUTH_PASSWORD env var. Default 'changeme' fails startup
  # unless spring.profiles.active includes dev or test.
  security:
    enabled: true                               # Set to false to disable auth (not recommended)
    username: bridge                            # HTTP Basic username
    password: ${BRIDGE_AUTH_PASSWORD:changeme}   # Set via env var in production

  # Bridge-owned immutable analyzer profile revisions. Site-created revisions
  # must remain under the image's declared persistent /data volume.
  profile-catalog:
    directory: ${BRIDGE_PROFILE_CATALOG_DIRECTORY:/data/openelis-analyzer-bridge/profile-catalog}
    shipped-pattern: classpath*:/analyzer-profiles/**/*.json

  connection-catalog:
    directory: ${BRIDGE_CONNECTION_CATALOG_DIRECTORY:/data/openelis-analyzer-bridge/connections}

  # Process-wide FILE runtime settings. Durable analyzer connections supply
  # their profile-owned directory, pattern, parser, and mapping values.
  file:
    enabled: true
    stateStorePath: ${BRIDGE_FILE_STATE_STORE_PATH:/data/openelis-analyzer-bridge/file-state.db}
    pollIntervalMs: 5000
    fileStabilityTimeoutMs: 3000
    maxRetryAttempts: 3
    retryDelayMs: 1000

# OpenELIS forwarding configuration
# NOTE: All bridge → OpenELIS transport forwarding uses this single configuration path.
org:
  itech:
    ahb:
      forward-http-server:
        # Base URI for normalized result delivery. Bridge appends /fhir for all
        # supported protocols and transports.
        # Example: http://localhost:8080/api/OpenELIS-Global/analyzer
        #       -> http://localhost:8080/api/OpenELIS-Global/analyzer/fhir
        uri: http://localhost:8080/api/OpenELIS-Global/analyzer
        username:
        password:
        insecure-tls: false
        connect-timeout-seconds: 30
        read-timeout-seconds: 30
        max-attempts: 3
        backoff-ms: 1000

      astm:
        enabled: true

      # ASTM LIS1-A Server - Listens for ASTM messages from analyzers
      listen-astm-server:
        port: 12001
        # Timeouts per CLSI LIS1-A specification
        establishment-timeout-seconds: 15
        receive-timeout-seconds: 30

      # ASTM E1381-95 Server - Listens for legacy ASTM messages
      listen-astm-e1381-95-server:
        port: 12011

      # Forward ASTM Server - Default target for sending messages TO analyzers
      forward-astm-server:
        host-name: localhost
        port: 5000

      # MLLP (HL7 v2.x) Listener - Concurrent connections on single port
      mllp:
        enabled: false  # Set to true to enable MLLP listener
        port: 2575      # Standard HL7 MLLP port (IANA registered)
        # Rate limiting: per source IP, prevents flooding
        # rateLimit:
        #   messagesPerSecond: 10

      # Serial port listener (RS-232/RS-485)
      serial:
        enabled: false  # Set to true to enable serial transport
        # ports:
        #   - path: /dev/ttyUSB0
        #     baudRate: 9600
        #     protocol: ASTM

# Server configuration
server:
  port: 8443

# Logging configuration
logging:
  level:
    root: INFO
    org.itech: DEBUG

# Actuator endpoints for health monitoring and metrics
# NOTE: Health and info endpoints are publicly accessible. Other actuator endpoints
# are also public by default but can be network-restricted in production.
# The /input and /api/profiles endpoints require HTTP Basic auth (see bridge.security above).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never  # Set to 'always' for debugging; restrict network access in production
  health:
    # Health indicators for each transport (disable if transport not in use)
    mllp:
      enabled: true
    serial:
      enabled: true
    filewatcher:
      enabled: true
    httpforward:
      enabled: true
