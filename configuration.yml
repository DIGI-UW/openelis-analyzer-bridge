# ============================================================================
# OpenELIS Analyzer Bridge configuration
# ============================================================================
# This file configures the bridge for bi-directional analyzer communication.
#
# CONFIGURATION FORMATS:
#
# 1. Bridge runtime settings (bridge.*)
#    Used by: security, profile catalog, durable connections, the delivery
#    outbox and FILE runtime.
#    Properties: bridge.file.*, bridge.outbox.*, bridge.profile-catalog.*,
#    bridge.connection-catalog.*, bridge.security.*
#
# 2. OpenELIS forwarding settings (org.itech.ahb.forward-http-server.*)
#    Used by: result delivery and the forward-server health check.
#    This is the single bridge → OE forwarding configuration path.
# ============================================================================

bridge:
  http:
    # Comma-separated proxy IPs; empty means forwarded identity headers are ignored.
    trusted-proxies: ${BRIDGE_HTTP_TRUSTED_PROXIES:}
  # HTTP Basic authentication for /input, /admin and the management APIs.
  # Protects against unauthorized data injection via the HTTP transport.
  # Non-HTTP transports (ASTM/TCP, MLLP, Serial, File) are unaffected.
  #
  # Password: Plaintext is BCrypt-encoded once at startup. Values already in delegating form
  # ({bcrypt}$2a$..., {noop}..., etc.) are stored as-is — do not double-encode.
  # In production, set BRIDGE_AUTH_PASSWORD env var. Default 'changeme' fails startup
  # unless spring.profiles.active includes dev or test.
  security:
    enabled: true                               # Basic auth on every endpoint except GET /actuator/health
    username: bridge                            # HTTP Basic username
    password: ${BRIDGE_AUTH_PASSWORD:changeme}   # Set via env var in production

  # Bridge-owned immutable analyzer profile revisions. Site-created revisions
  # must remain under the image's declared persistent /data volume.
  profile-catalog:
    directory: ${BRIDGE_PROFILE_CATALOG_DIRECTORY:/data/openelis-analyzer-bridge/profile-catalog}
    shipped-pattern: classpath*:/analyzer-profiles/**/*.json

  connection-catalog:
    directory: ${BRIDGE_CONNECTION_CATALOG_DIRECTORY:/data/openelis-analyzer-bridge/connections}

  # Process-wide FILE runtime settings. Durable analyzer connections supply
  # their profile-owned directory, pattern, parser, and mapping values.
  file:
    enabled: true
    stateStorePath: ${BRIDGE_FILE_STATE_STORE_PATH:/data/openelis-analyzer-bridge/file-state.db}
    pollIntervalMs: 5000
    fileStabilityTimeoutMs: 3000
    # Sized like the delivery outbox below: an overnight OpenELIS outage must not park a whole
    # run of file results. The source files are never deleted, so a parked file is recoverable,
    # but only by a person noticing.
    maxRetryAttempts: 150
    retryDelayMs: 1000
    maxRetryDelayMs: 600000

  # Durable delivery outbox. Every received result is persisted here before any
  # network I/O and stays, with its complete payload, until OpenELIS durably
  # accepts it or an operator can see why it could not be delivered.
  #
  # Unlike bridge.file above, this store cannot be disabled: it is the only copy
  # of a received result once the analyzer has sent it.
  outbox:
    dbPath: ${BRIDGE_OUTBOX_DB_PATH:/data/openelis-analyzer-bridge/outbox.db}
    pollInterval: 1s        # safety net; the receive path wakes the dispatcher directly
    lease: 120s             # must exceed connect + read timeout below
    retry:
      # Sized for an overnight OpenELIS outage: ~24h of retrying at the capped
      # interval. Dead-lettering a day of results because OpenELIS was down for
      # an evening would recreate the failure this outbox prevents.
      maxAttempts: ${BRIDGE_OUTBOX_RETRY_MAX_ATTEMPTS:150}
      baseDelay: 5s
      multiplier: 2.0
      maxDelay: 10m
      jitter: 0.2
    retention:
      delivered: 30d        # proof of delivery
      dismissed: 90d        # only entries an operator dismissed; undismissed dead letters are never purged
    payloadAccessEnabled: true

# OpenELIS forwarding configuration
# NOTE: All bridge → OpenELIS transport forwarding uses this single configuration path.
org:
  itech:
    ahb:
      forward-http-server:
        # Base URI for normalized result delivery. Bridge appends /fhir for all
        # supported protocols and transports.
        # Example: http://localhost:8080/api/OpenELIS-Global/analyzer
        #       -> http://localhost:8080/api/OpenELIS-Global/analyzer/fhir
        uri: http://localhost:8080/api/OpenELIS-Global/analyzer
        username:
        password:
        insecure-tls: false
        connect-timeout-seconds: 30
        read-timeout-seconds: 30
        max-attempts: 3
        backoff-ms: 1000

      astm:
        enabled: true

      # ASTM LIS1-A Server - Listens for ASTM messages from analyzers
      listen-astm-server:
        port: 12001

        # ASTM E1381-95 Server - Listens for legacy ASTM messages
        e1381-95:
          port: 12011

      # HL7 MLLP: when enabled, the shared listener on this port is bound at boot, and every
      # saved HL7 server connection joins it.
      mllp:
        enabled: false
        port: 2575

# Server configuration
server:
  port: 8443
  forward-headers-strategy: none

# Logging configuration
logging:
  level:
    root: INFO
    org.itech: DEBUG

# Actuator endpoints for health monitoring and metrics
# NOTE: GET /actuator/health is the only public endpoint, and it shows anonymous callers
# only the overall status. Every other endpoint, including /actuator/info,
# /actuator/prometheus, /actuator/metrics and per-component health such as
# /actuator/health/mllp, requires HTTP Basic auth (see bridge.security above).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized  # Components and details for authenticated callers only
  health:
    # Health indicators for each transport (disable if transport not in use)
    mllp:
      enabled: true
    serial:
      enabled: true
    filewatcher:
      enabled: true
    httpforward:
      enabled: true
    outbox:
      enabled: true
